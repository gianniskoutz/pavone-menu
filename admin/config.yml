backend:
  name: github
  repo: gianniskoutz/pavone-menu
  branch: main
  base_url: https://pavone-cms-auth.digital-menu.workers.dev

media_folder: "images"
public_folder: "/images"

collections:
  - name: "menu"
    label: "Διαχείριση Καταλόγου"
    files:
      - label: "1. Coffee / Beverages"
        name: "coffee_beverages"
        file: "coffee_beverages.json"
        fields:
          - {label: "Απόκρυψη Κατηγορίας", name: "hidden", widget: "boolean", default: false, required: false}
          - {label: "Coming Soon", name: "coming_soon", widget: "boolean", default: false, required: false}
          - label: "Προϊόντα"
            name: "items"
            widget: "list"
            fields:
              - {label: "Όνομα", name: "title", widget: "string"}
              - {label: "Συστατικά / Περιγραφή", name: "description", widget: "text", required: false}
              - {label: "Τιμή", name: "price", widget: "string"}
              - {label: "Φωτογραφία", name: "image", widget: "image", required: false}
              - {label: "Απόκρυψη Προϊόντος", name: "hidden", widget: "boolean", default: false, required: false}

      - label: "2. Brunch"
