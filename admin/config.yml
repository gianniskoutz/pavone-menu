backend:
  name: git-gateway
  branch: main

media_folder: "images"
public_folder: "/images"

collections:
  - name: "menu"
    label: "Διαχείριση Καταλόγου"
    files:
      - label: "1. Ροφήματα & Ποτά"
        name: "drinks"
        file: "drinks.json"
        fields:
          - { label: "Καφέδες (Coffee Menu)", name: "coffee", widget: "list", fields: [ {label: "Όνομα", name: "title", widget: "string"}, {label: "Τιμή", name: "price", widget: "string"}, {label: "Περιγραφή", name: "description", widget: "string", required: false} ] }
          - { label: "Spritz", name: "spritz", widget: "list", fields: [ {label: "Όνομα", name: "title", widget: "string"}, {label: "Τιμή", name: "price", widget: "string"}, {label: "Περιγραφή", name: "description", widget: "string", required: false} ] }
          - { label: "Classic Cocktails", name: "classic", widget: "list", fields: [ {label: "Όνομα", name: "title", widget: "string"}, {label: "Τιμή", name: "price", widget: "string"}, {label: "Περιγραφή", name: "description", widget: "string", required: false} ] }
          - { label: "Signature Cocktails", name: "signature", widget: "list", fields: [ {label: "Όνομα", name: "title", widget: "string"}, {label: "Τιμή", name: "price", widget: "string"}, {label: "Περιγραφή", name: "description", widget: "string", required: false} ] }
          - { label: "Spirits & Beers", name: "spirits", widget: "list", fields: [ {label: "Όνομα", name: "title", widget: "string"}, {label: "Τιμή", name: "price", widget: "string"}, {label: "Περιγραφή", name: "description", widget: "string", required: false} ] }
          - { label: "Κρασιά (Ποτήρι & Μπουκάλι)", name: "wines", widget: "list", fields: [ {label: "Όνομα", name: "title", widget: "string"}, {label: "Τιμή", name: "price", widget: "string"}, {label: "Περιγραφή", name: "description", widget: "string", required: false} ] }

      - label: "2. Brunch & Food"
        name: "food"
        file: "food.json"
        fields:
          - { label: "Bowls", name: "bowls", widget: "list", fields: [ {label: "Όνομα", name: "title", widget: "string"}, {label: "Τιμή", name: "price", widget: "string"}, {label: "Περιγραφή", name: "description", widget: "text", required: false}, {label: "Φωτογραφία", name: "image", widget: "image", required: false} ] }
          - { label: "Egg Dishes", name: "eggs", widget: "list", fields: [ {label: "Όνομα", name: "title", widget: "string"}, {label: "Τιμή", name: "price", widget: "string"}, {label: "Περιγραφή", name: "description", widget: "text", required: false}, {label: "Φωτογραφία", name: "image", widget: "image", required: false} ] }
          - { label: "Savory Options", name: "savory", widget: "list", fields: [ {label: "Όνομα", name: "title", widget: "string"}, {label: "Τιμή", name: "price", widget: "string"}, {label: "Περιγραφή", name: "description", widget: "text", required: false}, {label: "Φωτογραφία", name: "image", widget: "image", required: false} ] }
          - { label: "Sweet Options", name: "sweet", widget: "list", fields: [ {label: "Όνομα", name: "title", widget: "string"}, {label: "Τιμή", name: "price", widget: "string"}, {label: "Περιγραφή", name: "description", widget: "text", required: false}, {label: "Φωτογραφία", name: "image", widget: "image", required: false} ] }
