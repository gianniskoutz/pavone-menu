              - {label: "Όνομα", name: "title", widget: "string"}
              - {label: "Συστατικά / Περιγραφή", name: "description", widget: "string", required: false}
              - {label: "Τιμή", name: "price", widget: "string"}
              - {label: "Φωτογραφία", name: "image", widget: "image", required: false}
          - label: "ΚΡΑΣΙΑ ΠΟΤΗΡΙ / WINES (GLASS)"
            name: "wines_glass"
            widget: "list"
            fields:
              - {label: "Όνομα", name: "title", widget: "string"}
              - {label: "Συστατικά / Περιγραφή", name: "description", widget: "string", required: false}
              - {label: "Τιμή", name: "price", widget: "string"}
              - {label: "Φωτογραφία", name: "image", widget: "image", required: false}
          - label: "ΚΡΑΣΙΑ ΜΠΟΥΚΑΛΙ / WINES (BOTTLE)"
            name: "wines_bottle"
