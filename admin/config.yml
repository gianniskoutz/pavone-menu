              - {label: "Συστατικά / Περιγραφή", name: "description", widget: "text", required: false}
              - {label: "Τιμή", name: "price", widget: "string"}
              - {label: "Φωτογραφία", name: "image", widget: "image", required: false}
          - label: "SWEET OPTIONS"
            name: "sweet_options"
            widget: "list"
