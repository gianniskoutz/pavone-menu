backend:
  name: github
  repo: gianniskoutz/pavone-menu
  branch: main
  base_url: https://pavone-cms-auth.digital-menu.workers.dev

media_folder: "images"
public_folder: "/images"

collections:
  - name: "menu"
    label: "Διαχείριση Καταλόγου"
    files:
      - label: "1. Ροφήματα & Ποτά"
        name: "drinks"
        file: "drinks.json"
        fields:
          - label: "COFFEE MENU"
            name: "coffee"
            widget: "list"
            fields:
              - {label: "Όνομα", name: "title", widget: "string"}
              - {label: "Συστατικά / Περιγραφή", name: "description", widget: "string", required: false}
              - {label: "Τιμή", name: "price", widget: "string"}
              - {label: "Φωτογραφία", name: "image", widget: "image", required: false}
          - label: "SPRITZ"
            name: "spritz"
            widget: "list"
            fields:
              - {label: "Όνομα", name: "title", widget: "string"}
              - {label: "Συστατικά / Περιγραφή", name: "description", widget: "string", required: false}
              - {label: "Τιμή", name: "price", widget: "string"}
              - {label: "Φωτογραφία", name: "image", widget: "image", required: false}
          - label: "CLASSIC COCKTAILS"
            name: "classic"
            widget: "list"
            fields:
              - {label: "Όνομα", name: "title", widget: "string"}
              - {label: "Συστατικά / Περιγραφή", name: "description", widget: "string", required: false}
              - {label: "Τιμή", name: "price", widget: "string"}
              - {label: "Φωτογραφία", name: "image", widget: "image", required: false}
          - label: "SIGNATURE COCKTAILS"
            name: "signature"
            widget: "list"
            fields:
              - {label: "Όνομα", name: "title", widget: "string"}
              - {label: "Συστατικά / Περιγραφή", name: "description", widget: "string", required: false}
              - {label: "Τιμή", name: "price", widget: "string"}
              - {label: "Φωτογραφία", name: "image", widget: "image", required: false}
          - label: "SPIRITS / ΠΟΤΑ"
            name: "spirits"
            widget: "list"
            fields:
              - {label: "Όνομα", name: "title", widget: "string"}
              - {label: "Συστατικά / Περιγραφή", name: "description", widget: "string", required: false}
              - {label: "Τιμή", name: "price", widget: "string"}
              - {label: "Φωτογραφία", name: "image", widget: "image", required: false}
          - label: "ΜΠΥΡΕΣ / BEERS"
            name: "beers"
