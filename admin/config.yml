backend:
  name: github
  repo: gianniskoutz/pavone-menu
  branch: main
  base_url: https://pavone-cms-auth.digital-menu.workers.dev

publish_mode: editorial_workflow

media_folder: "images"
public_folder: "/images"

collections:
  - name: "menu"
    label: "Διαχείριση Καταλόγου"
    files:
      - label: "1. Ροφήματα & Ποτά"
        name: "drinks"
        file: "drinks.json"
        fields:
          - label: "Καφέδες (Coffee Menu)"
            name: "coffee"
            widget: "list"
            fields:
              - {label: "Όνομα Προϊόντος", name: "title", widget: "string"}
              - {label: "Τιμή (π.χ. 3.0/3.8 €)", name: "price", widget: "string"}
          - label: "Spritz"
            name: "spritz"
            widget: "list"
            fields:
              - {label: "Όνομα Προϊόντος", name: "title", widget: "string"}
              - {label: "Τιμή", name: "price", widget: "string"}
          - label: "Classic Cocktails"
            name: "cocktails"
            widget: "list"
            fields:
              - {label: "Όνομα Προϊόντος", name: "title", widget: "string"}
              - {label: "Τιμή", name: "price", widget: "string"}
