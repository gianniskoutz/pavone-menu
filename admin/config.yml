      - label: "2. Brunch Menu (Φαγητό)"
        name: "food"
        file: "food.json"
        fields:
          - label: "BOWLS"
            name: "bowls"
            widget: "list"
            fields:
              - {label: "Όνομα", name: "title", widget: "string"}
              - {label: "Συστατικά / Περιγραφή", name: "description", widget: "text", required: false}
              - {label: "Τιμή", name: "price", widget: "string"}
