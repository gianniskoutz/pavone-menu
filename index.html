<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pavone Menu</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary: #2b594a;  /* Βαθύ πράσινο */
            --accent: #c45a3a;   /* Κεραμιδί */
            --bg-color: #f4f1ea; /* Θερμό λευκό/μπεζ */
            --card-bg: #ffffff;
            --text-main: #333333;
            --text-muted: #666666;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 0;
            color: var(--text-main);
            -webkit-font-smoothing: antialiased;
        }

        .header {
            text-align: center;
            background-image: linear-gradient(rgba(26, 54, 50, 0.7), rgba(26, 54, 50, 0.7)), url('/images/header-bg.jpg');
            background-size: cover;
            background-position: center;
            padding: 50px 20px 40px; 
            color: #ffffff;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        
        .main-logo {
            width: 140px; 
            height: auto;
            margin-bottom: 5px;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.4)); 
            border-radius: 8px;
        }

        .header p {
            margin: 8px 0 0 0;
            font-size: 12px;
            letter-spacing: 4px;
            font-weight: 500;
            text-transform: uppercase;
            color: var(--accent); 
        }

        .nav-tabs {
            display: flex;
            justify-content: flex-start;
            gap: 12px;
            padding: 15px 20px;
            position: sticky;
            top: 0;
            z-index: 100;
            background-color: rgba(252, 251, 249, 0.95);
            backdrop-filter: blur(10px);
            overflow-x: auto; /* Επιτρέπει σκρολάρισμα */
            white-space: nowrap;
            /* Κρύβει το scrollbar οπτικά αλλά διατηρεί τη λειτουργία */
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        .nav-tabs::-webkit-scrollbar {
            display: none;
        }

        .nav-tabs button {
            background-color: var(--accent); 
            border: none;
            padding: 10px 22px;
            border-radius: 30px;
            font-family: 'Inter', sans-serif;
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 0.5px;
            color: #ffffff; 
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            flex-shrink: 0; /* Αποτρέπει τη συμπίεση των κουμπιών */
        }

        .nav-tabs button.active {
            background-color: var(--primary);
            color: #ffffff;
        }

        .menu-container {
            max-width: 600px;
            margin: 0 auto;
            padding: 15px 20px 60px 20px;
        }
        
        .menu-section {
            display: none;
            animation: slideFadeUp 0.4s ease-out forwards;
        }
        
        .menu-section.active {
            display: block;
        }
        
        @keyframes slideFadeUp {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .category-title {
            font-family: 'Playfair Display', serif;
            font-size: 18px;
            color: var(--primary);
            margin: 35px 0 15px 0;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 2px;
            border-bottom: 2px solid var(--accent);
            padding-bottom: 8px;
        }
        
        .category-title:first-child {
            margin-top: 5px;
        }

        .coming-soon-badge {
            text-align: center;
            background-color: var(--accent);
            color: white;
            padding: 8px 15px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
            display: table;
            margin: 20px auto;
            letter-spacing: 1px;
        }

        /* Στυλ για τις κάρτες φαγητού (Food/Brunch/Dinner) */
        .menu-card {
            background: var(--card-bg);
            border-radius: 16px;
            overflow: hidden;
            margin-bottom: 20px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.04);
            border: 1px solid rgba(0,0,0,0.02);
        }
        
        .menu-card img {
            width: 100%;
            height: 240px;
            object-fit: cover;
            display: block;
        }
        
        .menu-card-content {
            padding: 22px;
        }
        
        .menu-card-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 8px;
        }
        
        .menu-card-header h3 {
            margin: 0;
            font-family: 'Playfair Display', serif;
            font-size: 20px;
            color: var(--text-main);
            flex: 1;
            padding-right: 15px;
            line-height: 1.2;
        }
        
        .menu-card-header strong {
            color: var(--primary);
            font-size: 17px;
            font-weight: 600;
        }
        
        .product-desc {
            font-size: 14px;
            color: var(--text-muted);
            line-height: 1.6;
            margin: 0;
        }

        /* Στυλ για τις λίστες ποτών (Compact List) */
        .compact-list {
            background: var(--card-bg);
            padding: 10px 22px;
            border-radius: 16px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.04);
        }
        
        .compact-item {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            padding: 18px 0;
            border-bottom: 1px solid #f0f0f0;
            gap: 15px;
        }
        
        .compact-item:last-child {
            border-bottom: none;
        }
        
        .item-thumbnail {
            width: 70px;
            height: 70px;
            object-fit: cover;
            border-radius: 10px;
            flex-shrink: 0;
            box-shadow: 0 2px 6px rgba(0,0,0,0.08);
        }

        .compact-item > div {
            flex: 1; 
        }
        
        .compact-item h4 {
            margin: 0 0 4px 0;
            font-family: 'Inter', sans-serif;
            font-size: 15px;
            color: var(--text-main);
            font-weight: 600;
        }
        
        .compact-item p {
            margin: 0;
            font-size: 13px;
            color: var(--text-muted);
            line-height: 1.4;
        }
        
        .compact-item strong {
            color: var(--primary);
            font-size: 16px;
            font-weight: 600;
            white-space: nowrap; 
            flex-shrink: 0; 
            margin-top: -2px;
        }

        .wine-note {
            text-align: center;
            margin-top: 25px;
            padding: 20px 15px;
            background-color: var(--card-bg);
            border-radius: 16px;
            border: 1px solid rgba(0,0,0,0.03);
            box-shadow: 0 4px 15px rgba(0,0,0,0.02);
        }
        .wine-note p {
            margin: 6px 0;
            font-size: 13.5px;
            color: var(--text-muted);
            font-style: italic;
            font-weight: 500;
        }
        .wine-note p:before {
            content: "• ";
            color: var(--primary);
            font-weight: bold;
        }

    </style>
</head>
<body>

    <div class="header">
        <img src="/images/logo.png" alt="Pavone Logo" class="main-logo">
        <p>Premium Quality Menu</p>
    </div>

    <!-- 8 Κεντρικά Tabs -->
    <div class="nav-tabs">
        <button class="active" onclick="switchTab('coffee_beverages')">COFFEE & BEV</button>
        <button onclick="switchTab('brunch')">BRUNCH</button>
        <button onclick="switchTab('dinner')">DINNER</button>
        <button onclick="switchTab('spritz')">SPRITZ</button>
        <button onclick="switchTab('cocktails')">COCKTAILS</button>
        <button onclick="switchTab('drinks_beers')">DRINKS & BEERS</button>
        <button onclick="switchTab('wine_list')">WINE LIST</button>
        <button onclick="switchTab('sandwiches')">SANDWICHES</button>
    </div>

    <!-- 8 Ενότητες Μενού -->
    <div class="menu-container">
        <div id="section-coffee_beverages" class="menu-section active"><div id="container-coffee_beverages"></div></div>
        <div id="section-brunch" class="menu-section"><div id="container-brunch"></div></div>
        <div id="section-dinner" class="menu-section"><div id="container-dinner"></div></div>
        <div id="section-spritz" class="menu-section"><div id="container-spritz"></div></div>
        <div id="section-cocktails" class="menu-section"><div id="container-cocktails"></div></div>
        <div id="section-drinks_beers" class="menu-section"><div id="container-drinks_beers"></div></div>
        <div id="section-wine_list" class="menu-section"><div id="container-wine_list"></div></div>
        <div id="section-sandwiches" class="menu-section"><div id="container-sandwiches"></div></div>
    </div>

    <script>
        function switchTab(tabName) {
            document.querySelectorAll('.menu-section').forEach(section => section.classList.remove('active'));
            document.querySelectorAll('.nav-tabs button').forEach(button => button.classList.remove('active'));
            document.getElementById('section-' + tabName).classList.add('active');
            event.target.classList.add('active');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // Συνάρτηση για τα ποτά (Compact List)
        function renderDrinksCategory(container, title, items, isSubcategory = false) {
            if (!items || items.length === 0) return;
            
            if (!isSubcategory) {
                container.innerHTML += `<h3 class="category-title">${title}</h3>`;
            } else {
                container.innerHTML += `<h4 style="text-align: center; color: var(--accent); margin-top: 15px;">- ${title} -</h4>`;
            }

            items.forEach(item => {
                if (item.hidden === true) return; 

                container.innerHTML += `
                    <div class="compact-item">
                        ${item.image ? `<img src="${item.image}" alt="${item.title}" class="item-thumbnail">` : ''}
                        <div>
                            <h4>${item.title}</h4>
                            ${item.description ? `<p>${item.description}</p>` : ''}
                        </div>
                        <strong>${item.price} €</strong>
                    </div>
                `;
            });
        }

        // Συνάρτηση για το φαγητό (Menu Card)
        function renderFoodCategory(container, title, items, isSubcategory = false) {
            if (!items || items.length === 0) return;
            
            if (!isSubcategory) {
                container.innerHTML += `<h3 class="category-title">${title}</h3>`;
            } else {
                container.innerHTML += `<h4 style="text-align: center; color: var(--accent); margin-top: 15px;">- ${title} -</h4>`;
            }

            items.forEach(item => {
                if (item.hidden === true) return; 

                container.innerHTML += `
                    <div class="menu-card">
                        ${item.image ? `<img src="${item.image}" alt="${item.title}">` : ''}
                        <div class="menu-card-content">
                            <div class="menu-card-header">
                                <h3>${item.title}</h3>
                                <strong>${item.price} €</strong>
                            </div>
                            ${item.description ? `<p class="product-desc">${item.description}</p>` : ''}
                        </div>
                    </div>
                `;
            });
        }

        async function fetchMenuData() {
            // Δομή των 8 κατηγοριών. Το style ορίζει αν τυπώνονται σαν ποτά (compact) ή φαγητό (card).
            const categories = [
                { id: 'coffee_beverages', file: '/coffee_beverages.json', style: 'compact', title: 'Coffee / Beverages', type: 'simple' },
                { id: 'brunch', file: '/brunch.json', style: 'card', title: 'Brunch', type: 'complex', subs: [
                    {key: 'bowls', name: 'BOWLS'}, 
                    {key: 'egg_dishes', name: 'EGG DISHES'}, 
                    {key: 'savory_options', name: 'SAVORY OPTIONS'}, 
                    {key: 'sweet_options', name: 'SWEET OPTIONS'}
                ]},
                { id: 'dinner', file: '/dinner.json', style: 'card', title: 'Dinner', type: 'simple' },
                { id: 'spritz', file: '/spritz.json', style: 'compact', title: 'Spritz', type: 'simple' },
                { id: 'cocktails', file: '/cocktails.json', style: 'compact', title: 'Cocktails', type: 'simple' },
                { id: 'drinks_beers', file: '/drinks_beers.json', style: 'compact', title: 'Drinks / Beers', type: 'simple' },
                { id: 'wine_list', file: '/wine_list.json', style: 'compact', title: 'Wine List', type: 'complex', subs: [
                    {key: 'glass', name: 'BY THE GLASS'}, 
                    {key: 'bottle', name: 'BY THE BOTTLE'}
                ]},
                { id: 'sandwiches', file: '/sandwiches.json', style: 'card', title: 'Sandwiches', type: 'simple' }
            ];

            for (const cat of categories) {
                try {
                    const res = await fetch(cat.file);
                    if (!res.ok) continue;
                    const data = await res.json();

                    if (data.hidden) continue;

                    const targetContainer = document.getElementById(`container-${cat.id}`);
                    const renderFunc = (cat.style === 'compact') ? renderDrinksCategory : renderFoodCategory;

                    if (data.coming_soon) {
                        targetContainer.innerHTML += `
                            <h3 class="category-title">${cat.title}</h3>
                            <div class="coming-soon-badge">COMING SOON</div>
                        `;
                        continue; 
                    }

                    if (cat.type === 'simple') {
                        renderFunc(targetContainer, cat.title, data.items);
                    } else if (cat.type === 'complex') {
                        targetContainer.innerHTML += `<h3 class="category-title">${cat.title}</h3>`;
                        cat.subs.forEach(sub => {
                            if (data[sub.key] && data[sub.key].length > 0) {
                                renderFunc(targetContainer, sub.name, data[sub.key], true);
                            }
                        });
                    }

                    // Προσθήκη σημείωσης μόνο στην κατηγορία κρασιού
                    if (cat.id === 'wine_list') {
                        targetContainer.innerHTML += `
                            <div class="wine-note">
                                <p>Για την πλήρη λίστα κρασιών μας παρακαλώ ρωτήστε μας !</p>
                                <p>More wine options available please ask us !</p>
                            </div>
                        `;
                    }

                } catch (e) {
                    console.log(`Αναμονή για ${cat.file}`);
                }
            }
        }

        fetchMenuData();
    </script>
</body>
</html>
