<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pavone Menu</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary: #2b594a;  /* Βαθύ πράσινο */
            --accent: #c45a3a;   /* Κεραμιδί */
            --bg-color: #f4f1ea; /* Θερμό λευκό/μπεζ */
            --card-bg: #ffffff;
            --text-main: #333333;
            --text-muted: #666666;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 0;
            color: var(--text-main);
            -webkit-font-smoothing: antialiased;
        }

        .header {
            text-align: center;
            background-image: linear-gradient(rgba(26, 54, 50, 0.7), rgba(26, 54, 50, 0.7)), url('/images/header-bg.jpg');
            background-size: cover;
            background-position: center;
            padding: 50px 20px 40px; 
            color: #ffffff;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        
        .main-logo {
            width: 140px; 
            height: auto;
            margin-bottom: 5px;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.4)); 
            border-radius: 8px;
        }

        .header p {
            margin: 8px 0 0 0;
            font-size: 12px;
            letter-spacing: 4px;
            font-weight: 500;
            text-transform: uppercase;
            color: var(--accent); 
        }

        .nav-tabs {
            display: flex;
            justify-content: center;
            gap: 12px;
            padding: 20px;
            position: sticky;
            top: 0;
            z-index: 100;
            background-color: rgba(252, 251, 249, 0.95);
            backdrop-filter: blur(10px);
            overflow-x: auto; /* Επιτρέπει σκρολάρισμα αν δεν χωράνε τα κουμπιά */
            white-space: nowrap;
        }

        .nav-tabs button {
            background-color: var(--accent); 
            border: none;
            padding: 10px 22px;
            border-radius: 30px;
            font-family: 'Inter', sans-serif;
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 0.5px;
            color: #ffffff; 
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        .nav-tabs button.active {
            background-color: var(--primary);
            color: #ffffff;
        }

        .menu-container {
            max-width: 600px;
            margin: 0 auto;
            padding: 15px 20px 60px 20px;
        }
        
        .menu-section {
            display: none;
            animation: slideFadeUp 0.4s ease-out forwards;
        }
        
        .menu-section.active {
            display: block;
        }
        
        @keyframes slideFadeUp {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .category-title {
            font-family: 'Playfair Display', serif;
            font-size: 18px;
            color: var(--primary);
            margin: 35px 0 15px 0;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 2px;
            border-bottom: 2px solid var(--accent);
            padding-bottom: 8px;
        }
        
        .category-title:first-child {
            margin-top: 5px;
        }
        
        .empty-state {
            text-align: center;
            font-size: 13px;
            color: #999;
            margin-bottom: 20px;
            font-style: italic;
        }

        .coming-soon-badge {
            text-align: center;
            background-color: var(--accent);
            color: white;
            padding: 8px 15px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
            display: table;
            margin: 20px auto;
            letter-spacing: 1px;
        }

        /* Στυλ για τις κάρτες φαγητού (Food/Brunch/Dinner) */
        .menu-card {
            background: var(--card-bg);
            border-radius: 16px;
            overflow: hidden;
            margin-bottom: 20px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.04);
            border: 1px solid rgba(0,0,0,0.02);
        }
        
        .menu-card img {
            width: 100%;
            height: 240px;
            object-fit: cover;
            display: block;
        }
        
        .menu-card-content {
            padding: 22px;
        }
        
        .menu-card-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 8px;
        }
        
        .menu-card-header h3 {
            margin: 0;
            font-family: 'Playfair Display', serif;
            font-size: 20px;
            color: var(--text-main);
            flex: 1;
            padding-right: 15px;
            line-height: 1.2;
        }
        
        .menu-card-header strong {
            color: var(--primary);
            font-size: 17px;
            font-weight: 600;
        }
        
        .product-desc {
            font-size: 14px;
            color: var(--text-muted);
            line-height: 1.6;
            margin: 0;
        }

        /* Στυλ για τις λίστες ποτών (Compact List) */
        .compact-list {
            background: var(--card-bg);
            padding: 10px 22px;
            border-radius: 16px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.04);
        }
        
        .compact-item {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            padding: 18px 0;
            border-bottom: 1px solid #f0f0f0;
            gap: 15px;
        }
        
        .compact-item:last-child {
            border-bottom: none;
        }
        
        .item-thumbnail {
            width: 70px;
            height: 70px;
            object-fit: cover;
            border-radius: 10px;
            flex-shrink: 0;
            box-shadow: 0 2px 6px rgba(0,0,0,0.08);
        }

        .compact-item > div {
            flex: 1; 
        }
        
        .compact-item h4 {
            margin: 0 0 4px 0;
            font-family: 'Inter', sans-serif;
            font-size: 15px;
            color: var(--text-main);
            font-weight: 600;
        }
        
        .compact-item p {
            margin: 0;
            font-size: 13px;
            color: var(--text-muted);
            line-height: 1.4;
        }
        
        .compact-item strong {
            color: var(--primary);
            font-size: 16px;
            font-weight: 600;
            white-space: nowrap; 
            flex-shrink: 0; 
            margin-top: -2px;
        }

    </style>
</head>
<body>

    <div class="header">
        <img src="/images/logo.png" alt="Pavone Logo" class="main-logo">
        <p>Premium Quality Menu</p>
    </div>

    <!-- Κεντρικά Tabs -->
    <div class="nav-tabs">
        <button class="active" onclick="switchTab('drinks')">DRINKS & COFFEE</button>
        <button onclick="switchTab('food')">FOOD MENU</button>
    </div>

    <div class="menu-container">
        
        <!-- DRINKS SECTION (Περιλαμβάνει Coffee, Spritz, Cocktails, Beers, Wine) -->
        <div id="section-drinks" class="menu-section active">
            <div id="drinks-container"></div>
        </div>

        <!-- FOOD SECTION (Περιλαμβάνει Brunch, Dinner, Sandwiches) -->
        <div id="section-food" class="menu-section">
            <div id="food-container"></div>
        </div>
        
    </div>

    <script>
        // Αλλαγή Tab
        function switchTab(tabName) {
            document.querySelectorAll('.menu-section').forEach(section => section.classList.remove('active'));
            document.querySelectorAll('.nav-tabs button').forEach(button => button.classList.remove('active'));
            document.getElementById('section-' + tabName).classList.add('active');
            event.target.classList.add('active');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // Χαρτογράφηση των 8 κατηγοριών του CMS
        const menuConfig = [
            { id: 'coffee_beverages', title: 'Coffee / Beverages', target: 'drinks', type: 'simple', renderStyle: 'compact' },
            { id: 'spritz', title: 'Spritz', target: 'drinks', type: 'simple', renderStyle: 'compact' },
            { id: 'cocktails', title: 'Cocktails', target: 'drinks', type: 'simple', renderStyle: 'compact' },
            { id: 'drinks_beers', title: 'Drinks / Beers', target: 'drinks', type: 'simple', renderStyle: 'compact' },
            { id: 'wine_list', title: 'Wine List', target: 'drinks', type: 'complex', renderStyle: 'compact', subcategories: [
                { key: 'glass', name: 'BY THE GLASS' },
                { key: 'bottle', name: 'BY THE BOTTLE' }
            ]},
            { id: 'brunch', title: 'Brunch', target: 'food', type: 'complex', renderStyle: 'card', subcategories: [
                { key: 'bowls', name: 'BOWLS' },
                { key: 'egg_dishes', name: 'EGG DISHES' },
                { key: 'savory_options', name: 'SAVORY OPTIONS' },
                { key: 'sweet_options', name: 'SWEET OPTIONS' }
            ]},
            { id: 'sandwiches', title: 'Sandwiches', target: 'food', type: 'simple', renderStyle: 'card' },
            { id: 'dinner', title: 'Dinner', target: 'food', type: 'simple', renderStyle: 'card' }
        ];

        // Rendering για Compact στυλ (ποτά)
        function renderCompactItems(items) {
            let html = '<div class="compact-list">';
            items.forEach(item => {
                if (item.hidden) return; // Έλεγχος απόκρυψης
                html += `
                    <div class="compact-item">
                        ${item.image ? `<img src="${item.image}" alt="${item.title}" class="item-thumbnail">` : ''}
                        <div>
                            <h4>${item.title}</h4>
                            ${item.description ? `<p>${item.description}</p>` : ''}
                        </div>
                        <strong>${item.price} €</strong>
                    </div>
                `;
            });
            html += '</div>';
            return html;
        }

        // Rendering για Card στυλ (φαγητό)
        function renderCardItems(items) {
            let html = '';
            items.forEach(item => {
                if (item.hidden) return; // Έλεγχος απόκρυψης
                html += `
                    <div class="menu-card">
                        ${item.image ? `<img src="${item.image}" alt="${item.title}">` : ''}
                        <div class="menu-card-content">
                            <div class="menu-card-header">
                                <h3>${item.title}</h3>
                                <strong>${item.price} €</strong>
                            </div>
                            ${item.description ? `<p class="product-desc">${item.description}</p>` : ''}
                        </div>
                    </div>
                `;
            });
            return html;
        }

        // Κύρια συνάρτηση φόρτωσης δεδομένων
        async function loadMenu() {
            const drinksContainer = document.getElementById('drinks-container');
            const foodContainer = document.getElementById('food-container');

            for (const category of menuConfig) {
                try {
                    const response = await fetch(`/${category.id}.json`);
                    if (!response.ok) continue; 
                    
                    const data = await response.json();
                    
                    // 1. Έλεγχος Απόκρυψης Ολόκληρης της Κατηγορίας
                    if (data.hidden) continue;

                    let sectionHTML = `<h3 class="category-title">${category.title}</h3>`;

                    // 2. Έλεγχος Coming Soon
                    if (data.coming_soon) {
                        sectionHTML += `<div class="coming-soon-badge">Coming Soon</div>`;
                    } else {
                        // 3. Εμφάνιση Προϊόντων
                        if (category.type === 'simple' && data.items) {
                            sectionHTML += category.renderStyle === 'compact' ? renderCompactItems(data.items) : renderCardItems(data.items);
                        } else if (category.type === 'complex') {
                            category.subcategories.forEach(sub => {
                                if (data[sub.key] && data[sub.key].length > 0) {
                                    sectionHTML += `<h3 style="text-align: center; margin-bottom: 10px; font-size: 15px;">${sub.name}</h3>`;
                                    sectionHTML += category.renderStyle === 'compact' ? renderCompactItems(data[sub.key]) : renderCardItems(data[sub.key]);
                                }
                            });
                        }
                    }

                    // Τοποθέτηση στο σωστό Tab
                    if (category.target === 'drinks') {
                        drinksContainer.innerHTML += sectionHTML;
                    } else {
                        foodContainer.innerHTML += sectionHTML;
                    }

                } catch (error) {
                    console.log(`Αναμονή για δεδομένα της κατηγορίας: ${category.id}`);
                }
            }
        }

        // Εκκίνηση Φόρτωσης
        loadMenu();
    </script>
</body>
</html>
