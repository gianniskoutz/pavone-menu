<!DOCTYPE html>
<html lang="el">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pavone Menu</title>

    <!-- Εισαγωγή Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap"
        rel="stylesheet">

    <!-- Script για το Admin Login -->
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>

    <style>
        /* --- ΧΡΩΜΑΤΙΚΗ ΠΑΛΕΤΑ & ΜΕΤΑΒΛΗΤΕΣ --- */
        :root {
            --primary: #1a3632;
            /* Βαθύ Πράσινο (Pavone) */
            --accent: #c8a97e;
            /* Σαμπανιζέ / Χρυσό */
            --bg-color: #faf9f5;
            /* Θερμό υπόλευκο φόντο */
            --card-bg: #ffffff;
            --text-main: #2d3748;
            --text-muted: #718096;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 0;
            color: var(--text-main);
            -webkit-font-smoothing: antialiased;
        }

        /* --- HEADER --- */
        .header {
            text-align: center;
            padding: 40px 20px 30px;
            background-color: var(--primary);
            color: var(--accent);
            border-bottom: 4px solid var(--accent);
        }

        .header h1 {
            margin: 0;
            font-family: 'Playfair Display', serif;
            font-size: 34px;
            letter-spacing: 5px;
            text-transform: uppercase;
        }

        .header p {
            margin: 8px 0 0 0;
            font-size: 11px;
            letter-spacing: 3px;
            font-weight: 500;
            text-transform: uppercase;
            color: #ffffff;
            opacity: 0.7;
        }

        /* --- STICKY TABS (Πλοήγηση) --- */
        .nav-tabs {
            display: flex;
            justify-content: center;
            gap: 12px;
            padding: 20px;
            position: sticky;
            top: 0;
            z-index: 100;
            background-color: rgba(250, 249, 245, 0.95);
            backdrop-filter: blur(10px);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.03);
        }

        .nav-tabs button {
            background-color: transparent;
            border: 1px solid #e2e2e2;
            padding: 10px 22px;
            border-radius: 30px;
            font-family: 'Inter', sans-serif;
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 0.5px;
            color: var(--text-muted);
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .nav-tabs button.active {
            background-color: var(--primary);
            border-color: var(--primary);
            color: #fff;
            box-shadow: 0 4px 10px rgba(26, 54, 50, 0.2);
        }

        /* --- LAYOUT & ANIMATIONS --- */
        .menu-container {
            max-width: 600px;
            /* Διατηρεί τη φόρμα κινητού ακόμα και σε PC */
            margin: 0 auto;
            padding: 15px 20px 60px 20px;
        }

        .menu-section {
            display: none;
            animation: slideFadeUp 0.4s ease-out forwards;
        }

        .menu-section.active {
            display: block;
        }

        @keyframes slideFadeUp {
            from {
                opacity: 0;
                transform: translateY(15px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* --- ΚΑΡΤΕΣ ΦΑΓΗΤΟΥ --- */
        .menu-card {
            background: var(--card-bg);
            border-radius: 16px;
            overflow: hidden;
            margin-bottom: 25px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.04);
            border: 1px solid rgba(0, 0, 0, 0.02);
        }

        .menu-card img {
            width: 100%;
            height: 240px;
            object-fit: cover;
            display: block;
        }

        .menu-card-content {
            padding: 22px;
        }

        .menu-card-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 8px;
        }

        .menu-card-header h3 {
            margin: 0;
            font-family: 'Playfair Display', serif;
            font-size: 22px;
            color: var(--primary);
            flex: 1;
            padding-right: 15px;
            line-height: 1.2;
        }

        .menu-card-header strong {
            color: var(--accent);
            font-size: 18px;
            font-weight: 600;
        }

        .product-desc {
            font-size: 14px;
            color: var(--text-muted);
            line-height: 1.6;
            margin: 0;
        }

        /* --- ΛΙΣΤΑ ΚΑΦΕΔΩΝ --- */
        .compact-list {
            background: var(--card-bg);
            padding: 10px 22px;
            border-radius: 16px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.04);
        }

        .compact-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 18px 0;
            border-bottom: 1px solid #f0f0f0;
        }

        .compact-item:last-child {
            border-bottom: none;
        }

        .compact-item h4 {
            margin: 0 0 4px 0;
            font-family: 'Inter', sans-serif;
            font-size: 15px;
            color: var(--primary);
            font-weight: 600;
        }

        .compact-item p {
            margin: 0;
            font-size: 13px;
            color: var(--text-muted);
        }

        .compact-item strong {
            color: var(--accent);
            font-size: 16px;
            font-weight: 600;
        }
    </style>
</head>

<body>

    <!-- Header -->
    <div class="header">
        <h1>PAVONE</h1>
        <p>Premium Quality Menu</p>
    </div>

    <!-- Sticky Tabs -->
    <div class="nav-tabs">
        <button class="active" onclick="switchTab('food')">BRUNCH & FOOD</button>
        <button onclick="switchTab('coffee')">COFFEE MENU</button>
    </div>

    <!-- Κεντρικός Περιέκτης Μενού -->
    <div class="menu-container">

        <!-- Section Φαγητού -->
        <div id="section-food" class="menu-section active">
            <div id="food-list"></div>
        </div>

        <!-- Section Καφέδων -->
        <div id="section-coffee" class="menu-section">
            <div id="coffee-list" class="compact-list"></div>
        </div>

    </div>

    <!-- Javascript Δεδομένων & Πλοήγησης -->
    <script>
        // Λειτουργία Εναλλαγής Tabs
        function switchTab(tabName) {
            document.querySelectorAll('.menu-section').forEach(section => {
                section.classList.remove('active');
            });
            document.querySelectorAll('.nav-tabs button').forEach(button => {
                button.classList.remove('active');
            });
            document.getElementById('section-' + tabName).classList.add('active');
            event.target.classList.add('active');

            // Ομαλό scroll στην κορυφή του μενού αν είναι πιο κάτω
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // Άντληση Δεδομένων από το CMS
        async function fetchMenuData() {
            try {
                const response = await fetch('/menu.json');
                if (!response.ok) {
                    document.getElementById('food-list').innerHTML = "<p style='text-align:center; padding: 40px;'>Το μενού ετοιμάζεται...</p>";
                    return;
                }

                const data = await response.json();

                // Δημιουργία Φαγητού
                const foodContainer = document.getElementById('food-list');
                if (data.food && data.food.length > 0) {
                    foodContainer.innerHTML = '';
                    data.food.forEach(item => {
                        foodContainer.innerHTML += `
                            <div class="menu-card">
                                ${item.image ? `<img src="${item.image}" alt="${item.title}">` : ''}
                                <div class="menu-card-content">
                                    <div class="menu-card-header">
                                        <h3>${item.title}</h3>
                                        <strong>${item.price} €</strong>
                                    </div>
                                    ${item.description ? `<p class="product-desc">${item.description}</p>` : ''}
                                </div>
                            </div>
                        `;
                    });
                }

                // Δημιουργία Καφέδων
                const coffeeContainer = document.getElementById('coffee-list');
                if (data.coffee && data.coffee.length > 0) {
                    coffeeContainer.innerHTML = '';
                    data.coffee.forEach(item => {
                        coffeeContainer.innerHTML += `
                            <div class="compact-item">
                                <div>
                                    <h4>${item.title}</h4>
                                    ${item.description ? `<p>${item.description}</p>` : ''}
                                </div>
                                <strong>${item.price} €</strong>
                            </div>
                        `;
                    });
                }
            } catch (error) {
                console.error("Σφάλμα φόρτωσης:", error);
            }
        }

        fetchMenuData();

        // Netlify Identity Login Logic
        if (window.netlifyIdentity) {
            window.netlifyIdentity.on("init", user => {
                if (!user) {
                    window.netlifyIdentity.on("login", () => {
                        document.location.href = "/admin/";
                    });
                }
            });
        }
    </script>
</body>

</html>
