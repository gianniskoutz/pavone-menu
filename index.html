<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pavone Menu</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary: #6fbba2;  
            /* ΕΔΩ ΕΓΙΝΕ Η ΑΛΛΑΓΗ: Ελάχιστα πιο σκούρο ροδακινί */
            --accent: #f5d0bc;   
            --bg-color: #fcfbf9; 
            --card-bg: #ffffff;
            --text-main: #333333;
            --text-muted: #666666;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 0;
            color: var(--text-main);
            -webkit-font-smoothing: antialiased;
        }

        .header {
            text-align: center;
            background-image: linear-gradient(rgba(26, 54, 50, 0.7), rgba(26, 54, 50, 0.7)), url('/images/header-bg.jpg');
            background-size: cover;
            background-position: center;
            padding: 50px 20px 40px; 
            color: #ffffff;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        
        .main-logo {
            width: 140px; 
            height: auto;
            margin-bottom: 5px;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.4)); 
            border-radius: 8px;
        }

        .header p {
            margin: 8px 0 0 0;
            font-size: 12px;
            letter-spacing: 4px;
            font-weight: 500;
            text-transform: uppercase;
            color: var(--accent); 
        }

        .nav-tabs {
            display: flex;
            justify-content: center;
            gap: 12px;
            padding: 20px;
            position: sticky;
            top: 0;
            z-index: 100;
            background-color: rgba(252, 251, 249, 0.95);
            backdrop-filter: blur(10px);
        }
        .nav-tabs button {
            background-color: var(--accent); 
            border: none;
            padding: 10px 22px;
            border-radius: 30px;
            font-family: 'Inter', sans-serif;
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 0.5px;
            color: #555555;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        .nav-tabs button.active {
            background-color: var(--primary); 
            color: #ffffff;
            box-shadow: 0 4px 10px rgba(111, 187, 162, 0.3);
        }

        .menu-container {
            max-width: 600px;
            margin: 0 auto;
            padding: 15px 20px 60px 20px;
        }
        .menu-section {
            display: none;
            animation: slideFadeUp 0.4s ease-out forwards;
        }
        .menu-section.active {
            display: block;
        }
        @keyframes slideFadeUp {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .category-title {
            font-family: 'Playfair Display', serif;
            font-size: 18px;
            color: var(--primary);
            margin: 35px 0 15px 0;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 2px;
            border-bottom: 2px solid var(--accent);
            padding-bottom: 8px;
        }
        .category-title:first-child {
            margin-top: 5px;
        }
        
        .empty-state {
            text-align: center;
            font-size: 13px;
            color: #999;
            margin-bottom: 20px;
            font-style: italic;
        }

        .menu-card {
            background: var(--card-bg);
            border-radius: 16px;
            overflow: hidden;
            margin-bottom: 20px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.04);
            border: 1px solid rgba(0,0,0,0.02);
        }
        .menu-card img {
            width: 100%;
            height: 240px;
            object-fit: cover;
            display: block;
        }
        .menu-card-content {
            padding: 22px;
        }
        .menu-card-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 8px;
        }
        .menu-card-header h3 {
            margin: 0;
            font-family: 'Playfair Display', serif;
            font-size: 20px;
            color: var(--text-main);
            flex: 1;
            padding-right: 15px;
            line-height: 1.2;
        }
        .menu-card-header strong {
            color: var(--primary);
            font-size: 17px;
            font-weight: 600;
        }
        .product-desc {
            font-size: 14px;
            color: var(--text-muted);
            line-height: 1.6;
            margin: 0;
        }

        .compact-list {
            background: var(--card-bg);
            padding: 10px 22px;
            border-radius: 16px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.04);
        }
        .compact-item {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            padding: 18px 0;
            border-bottom: 1px solid #f0f0f0;
            gap: 15px;
        }
        .compact-item:last-child {
            border-bottom: none;
        }
        
        .item-thumbnail {
            width: 70px;
            height: 70px;
            object-fit: cover;
            border-radius: 10px;
            flex-shrink: 0;
            box-shadow: 0 2px 6px rgba(0,0,0,0.08);
        }

        .compact-item > div {
            flex: 1; 
        }
        .compact-item h4 {
            margin: 0 0 4px 0;
            font-family: 'Inter', sans-serif;
            font-size: 15px;
            color: var(--text-main);
            font-weight: 600;
        }
        .compact-item p {
            margin: 0;
            font-size: 13px;
            color: var(--text-muted);
            line-height: 1.4;
        }
        .compact-item strong {
            color: var(--primary);
            font-size: 16px;
            font-weight: 600;
            white-space: nowrap; 
            flex-shrink: 0; 
            margin-top: -2px;
        }

        .wine-note {
            text-align: center;
            margin-top: 25px;
            padding: 20px 15px;
            background-color: var(--card-bg);
            border-radius: 16px;
            border: 1px solid rgba(0,0,0,0.03);
            box-shadow: 0 4px 15px rgba(0,0,0,0.02);
        }
        .wine-note p {
            margin: 6px 0;
            font-size: 13.5px;
            color: var(--text-muted);
            font-style: italic;
            font-weight: 500;
        }
        .wine-note p:before {
            content: "• ";
            color: var(--primary);
            font-weight: bold;
        }

        .brunch-time-wrapper {
            text-align: center;
            margin: 10px 0 20px 0;
        }
        .brunch-time {
            display: inline-block;
            background-color: var(--primary);
            color: #ffffff;
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 2px;
            padding: 6px 20px;
            border-radius: 20px;
            box-shadow: 0 4px 10px rgba(111, 187, 162, 0.3);
        }

    </style>
</head>
<body>

    <div class="header">
        <img src="/images/logo.png" alt="Pavone Syros Logo" class="main-logo">
        <p>Premium Quality Menu</p>
    </div>

    <!-- Τα δύο βασικά Tabs -->
    <div class="nav-tabs">
        <button class="active" onclick="switchTab('coffee')">DRINKS & COFFEE</button>
        <button onclick="switchTab('food')">BRUNCH MENU</button>
    </div>

    <div class="menu-container">
        <!-- DRINKS SECTION -->
        <div id="section-coffee" class="menu-section active">
            <div id="drinks-container" class="compact-list"></div>
        </div>

        <!-- FOOD SECTION -->
        <div id="section-food" class="menu-section">
            <div class="brunch-time-wrapper">
                <div class="brunch-time">9:00 – 15:00</div>
            </div>
            <div id="food-container"></div>
        </div>
    </div>

    <script>
        function switchTab(tabName) {
            document.querySelectorAll('.menu-section').forEach(section => section.classList.remove('active'));
            document.querySelectorAll('.nav-tabs button').forEach(button => button.classList.remove('active'));
            document.getElementById('section-' + tabName).classList.add('active');
            event.target.classList.add('active');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function renderDrinksCategory(container, title, items) {
            container.innerHTML += `<h3 class="category-title">${title}</h3>`;
            
            if (!items || items.length === 0) {
                container.innerHTML += `<p class="empty-state">Προσθέστε είδη από το Admin...</p>`;
                return;
            }
            
            items.forEach(item => {
                container.innerHTML += `
                    <div class="compact-item">
                        ${item.image ? `<img src="${item.image}" alt="${item.title}" class="item-thumbnail">` : ''}
                        <div>
                            <h4>${item.title}</h4>
                            ${item.description ? `<p>${item.description}</p>` : ''}
                        </div>
                        <strong>${item.price} €</strong>
                    </div>
                `;
            });
        }

        function renderFoodCategory(container, title, items) {
            container.innerHTML += `<h3 class="category-title">${title}</h3>`;
            
            if (!items || items.length === 0) {
                container.innerHTML += `<p class="empty-state">Προσθέστε είδη από το Admin...</p>`;
                return;
            }
            
            items.forEach(item => {
                container.innerHTML += `
                    <div class="menu-card">
                        ${item.image ? `<img src="${item.image}" alt="${item.title}">` : ''}
                        <div class="menu-card-content">
                            <div class="menu-card-header">
                                <h3>${item.title}</h3>
                                <strong>${item.price} €</strong>
                            </div>
                            ${item.description ? `<p class="product-desc">${item.description}</p>` : ''}
                        </div>
                    </div>
                `;
            });
        }

       async function fetchMenuData() {
            try {
                const drinksRes = await fetch('/drinks.json');
                const drinksContainer = document.getElementById('drinks-container');
                
                if (drinksRes.ok) {
                    const drinksData = await drinksRes.json();
                    renderDrinksCategory(drinksContainer, "Coffee Menu", drinksData.coffee);
                    renderDrinksCategory(drinksContainer, "Spritz", drinksData.spritz);
                    renderDrinksCategory(drinksContainer, "Classic Cocktails", drinksData.classic);
                    renderDrinksCategory(drinksContainer, "Signature Cocktails", drinksData.signature);
                    renderDrinksCategory(drinksContainer, "Spirits / Ποτά", drinksData.spirits);
                    renderDrinksCategory(drinksContainer, "Μπύρες / Beers", drinksData.beers);
                    renderDrinksCategory(drinksContainer, "Κρασιά Ποτήρι / Wines (Glass)", drinksData.wines_glass);
                    renderDrinksCategory(drinksContainer, "Κρασιά Μπουκάλι / Wines (Bottle)", drinksData.wines_bottle);

                    drinksContainer.innerHTML += `
                        <div class="wine-note">
                            <p>Για την πλήρη λίστα κρασιών μας παρακαλώ ρωτήστε μας !</p>
                            <p>More wine options available please ask us !</p>
                        </div>
                    `;
                }
            } catch (e) { console.log("Αναμονή για δεδομένα ποτών..."); }

            try {
                const foodRes = await fetch('/food.json');
                const foodContainer = document.getElementById('food-container');
                
                if (foodRes.ok) {
                    const foodData = await foodRes.json();
                    renderFoodCategory(foodContainer, "Bowls", foodData.bowls);
                    renderFoodCategory(foodContainer, "Egg Dishes", foodData.egg_dishes);
                    renderFoodCategory(foodContainer, "Savory Options", foodData.savory_options);
                    renderFoodCategory(foodContainer, "Sweet Options", foodData.sweet_options);
                }
            } catch (e) { console.log("Αναμονή για δεδομένα φαγητού..."); }
        }

        fetchMenuData();
    </script>
</body>
</html>
