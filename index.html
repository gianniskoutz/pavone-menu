<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pavone Menu</title>
    
    <!-- Απαραίτητο Script για το Login του Admin -->
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>

    <style>
        /* Βασικές Ρυθμίσεις Σελίδας */
        body {
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            background-color: #f7f6f2; /* Ελαφρύ μπεζ/γκρι για premium αίσθηση */
            margin: 0;
            padding: 0;
            color: #333;
        }

        .header {
            text-align: center;
            padding: 30px 20px;
            background-color: #fff;
            border-bottom: 1px solid #eee;
        }

        .header h1 {
            margin: 0;
            letter-spacing: 2px;
            color: #2c3e50;
        }

        /* Τα κουμπιά πλοήγησης (Tabs) */
        .nav-tabs {
            display: flex;
            justify-content: center;
            gap: 10px;
            padding: 20px;
            overflow-x: auto;
        }
        .nav-tabs button {
            background-color: #e2ded5;
            border: none;
            padding: 10px 20px;
            border-radius: 20px;
            font-weight: bold;
            color: #555;
            cursor: pointer;
            transition: 0.3s;
        }
        .nav-tabs button.active {
            background-color: #6fbba2; /* Το πράσινο χρώμα του Pavone */
            color: #fff;
        }

        /* Κεντρικό Κουτί Μενού */
        .menu-container {
            max-width: 600px;
            margin: 0 auto;
            padding: 0 15px 40px 15px;
        }

        /* Εναλλαγή Κατηγοριών */
        .menu-section {
            display: none;
        }
        .menu-section.active {
            display: block;
        }

        /* Κάρτες Φαγητού */
        .menu-card {
            background: #fff;
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }
        .menu-card img {
            width: 100%;
            height: 220px;
            object-fit: cover;
        }
        .menu-card-content {
            padding: 15px;
        }
        .menu-card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }
        .menu-card-header h3 {
            margin: 0;
            font-size: 18px;
        }
        .menu-card-header strong {
            color: #6fbba2;
            font-size: 16px;
        }

        /* Δικά σου CSS για κείμενα & καφέδες */
        .product-desc {
            font-size: 14px;
            color: #666;
            line-height: 1.5;
            margin: 0;
        }
        .compact-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
            background: #fff;
            padding: 20px;
            border-radius: 12px;
        }
        .compact-item {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            padding-bottom: 15px;
            border-bottom: 1px dashed #ddd;
        }
        .compact-item:last-child {
            border-bottom: none;
            padding-bottom: 0;
        }
        .compact-item h4 {
            margin: 0 0 5px 0;
            font-size: 16px;
        }
    </style>
</head>
<body>

    <!-- Επικεφαλίδα (Header) -->
    <div class="header">
        <h1>PAVONE</h1>
    </div>

    <!-- Κουμπιά (Tabs) για Εναλλαγή Κατηγοριών -->
    <div class="nav-tabs">
        <button class="active" onclick="switchTab('food')">BRUNCH & FOOD</button>
        <button onclick="switchTab('coffee')">COFFEE MENU</button>
    </div>

    <!-- Κεντρικός χώρος που θα εμφανίζονται τα δεδομένα -->
    <div class="menu-container">
        
        <!-- Τομέας Φαγητού -->
        <div id="section-food" class="menu-section active">
            <div id="food-list">
                <!-- Η Javascript θα βάλει τις κάρτες φαγητού εδώ -->
                <p style="text-align:center; color:#999;">Φόρτωση μενού...</p>
            </div>
        </div>

        <!-- Τομέας Καφέδων -->
        <div id="section-coffee" class="menu-section">
            <div id="coffee-list" class="compact-list">
                <!-- Η Javascript θα βάλει τους καφέδες εδώ -->
            </div>
        </div>

    </div>

    <!-- JAVASCRIPT: Η λογική της σελίδας -->
    <script>
        // 1. Script για αλλαγή των Tabs (Φαγητό -> Καφές)
        function switchTab(tabName) {
            // Κρύβουμε όλα τα sections
            document.querySelectorAll('.menu-section').forEach(section => {
                section.classList.remove('active');
            });
            // Βγάζουμε το πράσινο χρώμα από όλα τα κουμπιά
            document.querySelectorAll('.nav-tabs button').forEach(button => {
                button.classList.remove('active');
            });

            // Εμφανίζουμε το σωστό section και βάφουμε πράσινο το κουμπί που πατήθηκε
            document.getElementById('section-' + tabName).classList.add('active');
            event.target.classList.add('active');
        }

        // 2. Script που διαβάζει τα δεδομένα από το CMS (menu.json)
        async function fetchMenuData() {
            try {
                const response = await fetch('/menu.json');
                if (!response.ok) {
                    document.getElementById('food-list').innerHTML = "<p style='text-align:center;'>Δεν βρέθηκαν πιάτα. Προσθέστε από το Admin.</p>";
                    return;
                }

                const data = await response.json();
                
                // --- Δημιουργία λίστας Φαγητού ---
                const foodContainer = document.getElementById('food-list');
                if (data.food && data.food.length > 0) {
                    foodContainer.innerHTML = ''; // Καθαρίζουμε το "Φόρτωση..."
                    data.food.forEach(item => {
                        foodContainer.innerHTML += `
                            <div class="menu-card">
                                ${item.image ? `<img src="${item.image}" alt="${item.title}">` : ''}
                                <div class="menu-card-content">
                                    <div class="menu-card-header">
                                        <h3>${item.title}</h3>
                                        <strong>${item.price} €</strong>
                                    </div>
                                    ${item.description ? `<p class="product-desc">${item.description}</p>` : ''}
                                </div>
                            </div>
                        `;
                    });
                } else {
                    foodContainer.innerHTML = "<p style='text-align:center;'>Το μενού φαγητού είναι άδειο.</p>";
                }

                // --- Δημιουργία λίστας Καφέδων ---
                const coffeeContainer = document.getElementById('coffee-list');
                if (data.coffee && data.coffee.length > 0) {
                    coffeeContainer.innerHTML = '';
                    data.coffee.forEach(item => {
                        coffeeContainer.innerHTML += `
                            <div class="compact-item">
                                <div>
                                    <h4>${item.title}</h4>
                                    ${item.description ? `<p class="product-desc">${item.description}</p>` : ''}
                                </div>
                                <strong>${item.price} €</strong>
                            </div>
                        `;
                    });
                }
            } catch (error) {
                console.error("Σφάλμα:", error);
            }
        }

        // Τρέχουμε τη συνάρτηση με το που φορτώσει η σελίδα
        fetchMenuData();

        // 3. Απαραίτητο Script για το Netlify Identity (Για το Login)
        if (window.netlifyIdentity) {
            window.netlifyIdentity.on("init", user => {
                if (!user) {
                    window.netlifyIdentity.on("login", () => {
                        document.location.href = "/admin/";
                    });
                }
            });
        }
    </script>
</body>
</html>
