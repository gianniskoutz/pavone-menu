<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pavone Menu</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>

    <style>
        :root {
            --primary: #6fbba2;  
            --accent: #ffe0d1;   
            --bg-color: #fcfbf9; 
            --card-bg: #ffffff;
            --text-main: #333333;
            --text-muted: #666666;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 0;
            color: var(--text-main);
            -webkit-font-smoothing: antialiased;
        }

        .header {
            text-align: center;
            padding: 30px 20px 20px;
            background-color: var(--card-bg);
            color: var(--primary);
        }
        .header h1 {
            margin: 0;
            font-family: 'Playfair Display', serif;
            font-size: 34px;
            letter-spacing: 5px;
            text-transform: uppercase;
        }
        .header p {
            margin: 8px 0 0 0;
            font-size: 11px;
            letter-spacing: 3px;
            font-weight: 500;
            text-transform: uppercase;
            color: var(--text-muted);
        }

        .nav-tabs {
            display: flex;
            justify-content: center;
            gap: 12px;
            padding: 20px;
            position: sticky;
            top: 0;
            z-index: 100;
            background-color: rgba(252, 251, 249, 0.95);
            backdrop-filter: blur(10px);
        }
        .nav-tabs button {
            background-color: var(--accent); 
            border: none;
            padding: 10px 22px;
            border-radius: 30px;
            font-family: 'Inter', sans-serif;
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 0.5px;
            color: #555555;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        .nav-tabs button.active {
            background-color: var(--primary); 
            color: #ffffff;
            box-shadow: 0 4px 10px rgba(111, 187, 162, 0.3);
        }

        .menu-container {
            max-width: 600px;
            margin: 0 auto;
            padding: 15px 20px 60px 20px;
        }
        .menu-section {
            display: none;
            animation: slideFadeUp 0.4s ease-out forwards;
        }
        .menu-section.active {
            display: block;
        }
        @keyframes slideFadeUp {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .category-title {
            font-family: 'Playfair Display', serif;
            font-size: 18px;
            color: var(--primary);
            margin: 35px 0 15px 0;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 2px;
            border-bottom: 2px solid var(--accent);
            padding-bottom: 8px;
        }
        .category-title:first-child {
            margin-top: 5px;
        }
        
        .empty-state {
            text-align: center;
            font-size: 13px;
            color: #999;
            margin-bottom: 20px;
            font-style: italic;
        }

        .menu-card {
            background: var(--card-bg);
            border-radius: 16px;
            overflow: hidden;
            margin-bottom: 20px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.04);
            border: 1px solid rgba(0,0,0,0.02);
        }
        .menu-card img {
            width: 100%;
            height: 240px;
            object-fit: cover;
            display: block;
        }
        .menu-card-content {
            padding: 22px;
        }
        .menu-card-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 8px;
        }
        .menu-card-header h3 {
            margin: 0;
            font-family: 'Playfair Display', serif;
            font-size: 20px;
            color: var(--text-main);
            flex: 1;
            padding-right: 15px;
            line-height: 1.2;
        }
        .menu-card-header strong {
            color: var(--primary);
            font-size: 17px;
            font-weight: 600;
        }
        .product-desc {
            font-size: 14px;
            color: var(--text-muted);
            line-height: 1.6;
            margin: 0;
        }

        .compact-list {
            background: var(--card-bg);
            padding: 10px 22px;
            border-radius: 16px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.04);
        }
        .compact-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 18px 0;
            border-bottom: 1px solid #f0f0f0;
        }
        .compact-item:last-child {
            border-bottom: none;
        }
        .compact-item h4 {
            margin: 0 0 4px 0;
            font-family: 'Inter', sans-serif;
            font-size: 15px;
            color: var(--text-main);
            font-weight: 600;
        }
        .compact-item p {
            margin: 0;
            font-size: 13px;
            color: var(--text-muted);
        }
        .compact-item strong {
            color: var(--primary);
            font-size: 16px;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>PAVONE</h1>
        <p>Premium Quality Menu</p>
    </div>

    <!-- Τα δύο βασικά Tabs -->
    <div class="nav-tabs">
        <button class="active" onclick="switchTab('coffee')">DRINKS & COFFEE</button>
        <button onclick="switchTab('food')">BRUNCH MENU</button>
    </div>

    <div class="menu-container">
        <!-- DRINKS SECTION -->
        <div id="section-coffee" class="menu-section active">
            <div id="drinks-container" class="compact-list"></div>
        </div>

        <!-- FOOD SECTION -->
        <div id="section-food" class="menu-section">
            <div id="food-container"></div>
        </div>
    </div>

    <script>
        function switchTab(tabName) {
            document.querySelectorAll('.menu-section').forEach(section => section.classList.remove('active'));
            document.querySelectorAll('.nav-tabs button').forEach(button => button.classList.remove('active'));
            document.getElementById('section-' + tabName).classList.add('active');
            event.target.classList.add('active');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // Τώρα οι τίτλοι εμφανίζονται ΠΑΝΤΑ, ακόμα και αν είναι άδειοι
        function renderDrinksCategory(container, title, items) {
            container.innerHTML += `<h3 class="category-title">${title}</h3>`;
            
            if (!items || items.length === 0) {
                container.innerHTML += `<p class="empty-state">Προσθέστε είδη από το Admin...</p>`;
                return;
            }
            
            items.forEach(item => {
                container.innerHTML += `
                    <div class="compact-item">
                        <div>
                            <h4>${item.title}</h4>
                            ${item.description ? `<p>${item.description}</p>` : ''}
                        </div>
                        <strong>${item.price} €</strong>
                    </div>
                `;
            });
        }

        function renderFoodCategory(container, title, items) {
            container.innerHTML += `<h3 class="category-title">${title}</h3>`;
            
            if (!items || items.length === 0) {
                container.innerHTML += `<p class="empty-state">Προσθέστε είδη από το Admin...</p>`;
                return;
            }
            
            items.forEach(item => {
                container.innerHTML += `
                    <div class="menu-card">
                        ${item.image ? `<img src="${item.image}" alt="${item.title}">` : ''}
                        <div class="menu-card-content">
                            <div class="menu-card-header">
                                <h3>${item.title}</h3>
                                <strong>${item.price} €</strong>
                            </div>
                            ${item.description ? `<p class="product-desc">${item.description}</p>` : ''}
                        </div>
                    </div>
                `;
            });
        }

        async function fetchMenuData() {
            // Δοκιμή φόρτωσης Δεδομένων Ποτών (Αν το αρχείο δεν υπάρχει ακόμα, απλά θα δείξει τους άδειους τίτλους)
            try {
                const drinksRes = await fetch('/drinks.json');
                const drinksContainer = document.getElementById('drinks-container');
                
                if (drinksRes.ok) {
                    const drinksData = await drinksRes.json();
                    renderDrinksCategory(drinksContainer, "Coffee Menu", drinksData.coffee);
                    renderDrinksCategory(drinksContainer, "Spritz", drinksData.spritz);
                    renderDrinksCategory(drinksContainer, "Classic Cocktails", drinksData.classic);
                    renderDrinksCategory(drinksContainer, "Signature Cocktails", drinksData.signature);
                    renderDrinksCategory(drinksContainer, "Spirits & Beers", drinksData.spirits);
                    renderDrinksCategory(drinksContainer, "Wines", drinksData.wines);
                } else {
                    renderDrinksCategory(drinksContainer, "Coffee Menu", []);
                    renderDrinksCategory(drinksContainer, "Spritz", []);
                    renderDrinksCategory(drinksContainer, "Classic Cocktails", []);
                    renderDrinksCategory(drinksContainer, "Signature Cocktails", []);
                    renderDrinksCategory(drinksContainer, "Spirits & Beers", []);
                    renderDrinksCategory(drinksContainer, "Wines", []);
                }
            } catch (e) { console.log("Αναμονή για δεδομένα..."); }

            // Δοκιμή φόρτωσης Δεδομένων Φαγητού
            try {
                const foodRes = await fetch('/food.json');
                const foodContainer = document.getElementById('food-container');
                
                if (foodRes.ok) {
                    const foodData = await foodRes.json();
                    renderFoodCategory(foodContainer, "Bowls", foodData.bowls);
                    renderFoodCategory(foodContainer, "Egg Dishes", foodData.eggs);
                    renderFoodCategory(foodContainer, "Savory Options", foodData.savory);
                    renderFoodCategory(foodContainer, "Sweet Options", foodData.sweet);
                } else {
                    renderFoodCategory(foodContainer, "Bowls", []);
                    renderFoodCategory(foodContainer, "Egg Dishes", []);
                    renderFoodCategory(foodContainer, "Savory Options", []);
                    renderFoodCategory(foodContainer, "Sweet Options", []);
                }
            } catch (e) { console.log("Αναμονή για δεδομένα..."); }
        }

        fetchMenuData();

        if (window.netlifyIdentity) {
            window.netlifyIdentity.on("init", user => {
                if (!user) {
                    window.netlifyIdentity.on("login", () => {
                        document.location.href = "/admin/";
                    });
                }
            });
        }
    </script>
</body>
</html>
